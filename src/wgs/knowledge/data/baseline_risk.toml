# Cited baseline risks and confirmed per-SD effect sizes for absolute-risk estimates (ADR-018).
#
# Policy: hand-maintained, changes rarely. Every row quotes its source verbatim; `wgs audit --only curated` re-fetches
# each source and fails a row whose quoted numbers no longer appear there. No row may be added without a quote.
#   [[baseline]] measure = "lifetime_risk" (cumulative risk over age_window) or "prevalence" (share who have/had it;
#                used only where no lifetime risk could be verified, and labelled as prevalence in the dashboard).
#   [[per_sd]]   an odds/hazard ratio the paper itself states is per standard deviation of this PGS.
# Hand-maintained, cited baseline risk + per-SD confirmation table
# Compiled 2026-10-07. Every row's `quote` is a verbatim string copied from a
# directly fetched source (SEER/PubMed/PMC/EuropePMC/CDC/NIAID/PGS Catalog).
# Rows omitted (not fabricated) when no verifiable number could be found.

