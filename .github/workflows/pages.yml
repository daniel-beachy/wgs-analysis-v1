# The public demo dashboard: the viewer built from this repo plus the HG002 demo data, which lives in a release
# asset because the repo holds code only (ADR-028). `pixi run demo-site` uploads new data and starts this workflow.
name: Deploy the demo to GitHub Pages

on:
  push:
    branches: [main]
    paths: [viewer/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: viewer
      - run: npm run build
        working-directory: viewer
      - name: Add the newest demo data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("demo-data-"))] | sort_by(.createdAt) | last | .tagName // empty')
          test -n "$tag" || { echo "No demo-data-* release: run pixi run demo-site locally first."; exit 1; }
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern demo-site.tar.gz --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/demo-site.tar.gz" -C viewer/dist
          test -f viewer/dist/data/index.json
          echo "Demo data: $tag" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
