<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="960" height="300" fill="#0f172a"/>
  <g fill="#e2e8f0">
    <text x="480" y="28" text-anchor="middle" font-size="17" font-weight="bold">Zooming in: from a person to a single DNA letter</text>
  </g>
  <!-- person -->
  <g transform="translate(70,70)" stroke="#94a3b8" stroke-width="3" fill="none">
    <circle cx="40" cy="20" r="16"/>
    <line x1="40" y1="36" x2="40" y2="100"/>
    <line x1="40" y1="55" x2="12" y2="80"/><line x1="40" y1="55" x2="68" y2="80"/>
    <line x1="40" y1="100" x2="18" y2="140"/><line x1="40" y1="100" x2="62" y2="140"/>
  </g>
  <!-- cell -->
  <g transform="translate(230,80)">
    <ellipse cx="60" cy="60" rx="58" ry="52" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <ellipse cx="60" cy="60" rx="26" ry="23" fill="#334155" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="25" cy="35" r="6" fill="#f472b6"/><circle cx="95" cy="80" r="6" fill="#f472b6"/>
  </g>
  <!-- chromosome -->
  <g transform="translate(410,70)" fill="#a78bfa">
    <rect x="10" y="0" width="22" height="64" rx="11"/><rect x="10" y="72" width="22" height="80" rx="11"/>
    <rect x="40" y="0" width="22" height="64" rx="11"/><rect x="40" y="72" width="22" height="80" rx="11"/>
    <rect x="30" y="58" width="12" height="20" fill="#7c3aed"/>
  </g>
  <!-- DNA helix -->
  <g transform="translate(540,70)" stroke-width="3" fill="none">
    <path d="M0,0 C40,25 40,50 0,75 C-40,100 -40,125 0,150" stroke="#38bdf8" transform="translate(60,0)"/>
    <path d="M0,0 C-40,25 -40,50 0,75 C40,100 40,125 0,150" stroke="#f472b6" transform="translate(60,0)"/>
    <g stroke="#64748b" stroke-width="2">
      <line x1="34" y1="18" x2="86" y2="18"/><line x1="30" y1="38" x2="90" y2="38"/><line x1="40" y1="58" x2="80" y2="58"/>
      <line x1="40" y1="92" x2="80" y2="92"/><line x1="30" y1="112" x2="90" y2="112"/><line x1="34" y1="132" x2="86" y2="132"/>
    </g>
  </g>
  <!-- letters -->
  <g transform="translate(700,95)" font-family="Menlo, monospace" font-size="20" font-weight="bold">
    <text x="0" y="0" fill="#94a3b8">…GATT<tspan fill="#facc15">A</tspan>CAG…</text>
    <text x="0" y="34" fill="#94a3b8">…CTAA<tspan fill="#facc15">T</tspan>GTC…</text>
    <text x="0" y="80" fill="#e2e8f0" font-size="13" font-weight="normal">one "base pair" (A pairs with T,</text>
    <text x="0" y="98" fill="#e2e8f0" font-size="13" font-weight="normal">C pairs with G)</text>
  </g>
  <!-- arrows -->
  <g stroke="#475569" stroke-width="2" marker-end="url(#a)">
    <line x1="165" y1="140" x2="222" y2="140"/><line x1="355" y1="140" x2="405" y2="140"/>
    <line x1="480" y1="140" x2="530" y2="140"/><line x1="630" y1="140" x2="690" y2="140"/>
  </g>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#475569"/></marker></defs>
  <!-- captions -->
  <g fill="#cbd5e1" text-anchor="middle">
    <text x="110" y="250">You</text><text x="110" y="268" fill="#64748b">~30 trillion cells</text>
    <text x="290" y="250">A cell</text><text x="290" y="268" fill="#64748b">DNA lives in the nucleus</text>
    <text x="446" y="250">A chromosome</text><text x="446" y="268" fill="#64748b">23 pairs, tightly coiled DNA</text>
    <text x="600" y="250">The double helix</text><text x="600" y="268" fill="#64748b">two complementary strands</text>
    <text x="800" y="250">The letters (bases)</text><text x="800" y="268" fill="#64748b">~3.1 billion per copy</text>
  </g>
</svg>
