[workspace]
name = "wgs-analysis"
version = "0.1.0"
description = "Personal whole-genome exploration: portable, evidence-graded, refreshable."
channels = ["conda-forge", "bioconda"]
platforms = ["osx-arm64", "linux-64", "osx-64"]

[dependencies]
python = "3.12.*"
duckdb = ">=1.3"
python-duckdb = ">=1.3"
pyarrow = ">=17"
pysam = ">=0.22"
typer = ">=0.12"
rich = ">=13"
tomli-w = ">=1.0"
bcftools = ">=1.21"
samtools = ">=1.21"
htslib = ">=1.21"
openjdk = "21.*"
pytest = ">=8"
ruff = ">=0.6"
mosdepth = ">=0.3.10"
numpy = ">=2.5.3,<3"
pandas = ">=3.0.6,<4"
nodejs = ">=26.10.0,<26.11"
go = ">=1.27.1,<2"
slivar = ">=0.3.3"

[pypi-dependencies]
wgs = { path = ".", editable = true }

# T1K (HLA typing): the bioconda builds for Intel Mac and Linux don't solve with
# this environment, so it is installed on Apple Silicon only. Elsewhere HLA calls
# are skipped, or read from T1K output produced separately.
[target.osx-arm64.dependencies]
t1k = ">=1.0.10,<2"

# Cyrius (CYP2D6 caller) lives in its own environment: it is pip-only and would
# otherwise pull a second, pip-built copy of pysam over the conda one.
[feature.cyrius.dependencies]
python = "3.12.*"
pysam = ">=0.22"
scipy = ">=1.11"
statsmodels = ">=0.14"
numpy = ">=1.26"

[feature.cyrius.pypi-dependencies]
cyrius = ">=1.1.1, <2"

[environments]
cyrius = { features = ["cyrius"], no-default-feature = true }

[tasks]
wgs = "python -m wgs"
doctor = "python -m wgs doctor"
test = "pytest -q"
lint = "ruff check src tests scripts"
install-hooks = "git config core.hooksPath scripts/hooks"
guard = "python scripts/data_guard.py --all"
build-dashboard = "python scripts/build_dashboard.py"
