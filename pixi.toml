[workspace]
name = "wgs-analysis"
version = "0.1.0"
description = "Personal whole-genome exploration: portable, evidence-graded, refreshable."
channels = ["conda-forge", "bioconda"]
platforms = ["osx-arm64", "linux-64", "osx-64"]

[dependencies]
python = "3.12.*"
duckdb = ">=1.3"
python-duckdb = ">=1.3"
pyarrow = ">=17"
pysam = ">=0.22"
typer = ">=0.12"
rich = ">=13"
tomli-w = ">=1.0"
bcftools = ">=1.21"
samtools = ">=1.21"
htslib = ">=1.21"
openjdk = "21.*"
pytest = ">=8"
ruff = ">=0.6"
mosdepth = ">=0.3.10"
numpy = ">=2.5.3,<3"
pandas = ">=3.0.6,<4"

[pypi-dependencies]
wgs = { path = ".", editable = true }

[tasks]
wgs = "python -m wgs"
doctor = "python -m wgs doctor"
test = "pytest -q"
lint = "ruff check src tests scripts"
install-hooks = "git config core.hooksPath scripts/hooks"
guard = "python scripts/data_guard.py --all"
